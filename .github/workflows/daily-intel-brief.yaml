name: Deploy Daily Strategic Intel Briefing

on:
  schedule:
    # 06:30 EST is 10:30 UTC
    - cron: '30 10 * * *'
  workflow_dispatch: # Allows manual trigger on demand

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Telemetry Dependencies
        run: |
          pip install requests

      - name: Execute Daily Telemetry Update Script
        run: |
          python update_dashboard.py

      - name: Commit and Push Updated Intel Briefing
        run: |
          git config --local user.email "operations@matthewsopslab.internal"
          git config --local user.name "Matthews Operations Lab System"
          git add index.html
          git commit -m "Automated Strategic Intel Update - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
